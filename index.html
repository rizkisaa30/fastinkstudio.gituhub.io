<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fastink Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .content {
            max-width: 1000px;
            width: 100%;
        }

        .small {
            color: #ff0055;
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(60px, 12vw, 150px);
            line-height: 0.85;
            margin: 0;
            letter-spacing: -8px;
        }

        h2 {
            font-size: 28px;
            margin-top: 40px;
        }

        p {
            max-width: 550px;
            color: #bdbdbd;
            font-size: 18px;
            line-height: 1.6;
        }

        .line {
            width: 100%;
            height: 1px;
            background: #333;
            margin: 50px 0;
        }

        .contact {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }

        .contact a {
            color: white;
            text-decoration: none;
            border-bottom: 1px solid white;
            padding-bottom: 5px;
        }

        .contact a:hover {
            color: #ff0055;
            border-color: #ff0055;
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="content">

            <div class="small">DESIGNER / ILLUSTRATOR</div>

            <h1>
                FASTINK<br>
                STUDIO
            </h1>

            <div class="line"></div>

            <h2>HI, I'M RIZKI.</h2>

            <p>
                I'm a graphic designer and illustrator.
                I create visual identities, illustrations,
                jersey designs, posters, and other creative works.
            </p>

            <div class="line"></div>

            <div class="contact">
                <a href="#">Instagram</a>
                <a href="#">WhatsApp</a>
                <a href="#">Email</a>
            </div>

        </div>
    </main>

</body>
</html>
